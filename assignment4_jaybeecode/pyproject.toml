[project]
name = "uniswap-v3-dbt"
version = "0.1.0"
description = "Uniswap V3 swaps from Ethereum into Postgres, modelled with dbt"
requires-python = ">=3.10,<3.14"
dependencies = [
    "dbt-core>=1.12,<2",
    "dbt-postgres>=1.11,<2",
    "web3>=7,<8",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false
